name: Codeep Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

# pull-requests:write lets the action post its sticky summary comment.
# GitHub auto-downgrades it to read-only on fork PRs — the action degrades
# gracefully (annotations + check still work, comment is skipped).
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: codeep-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Codeep Review
        uses: VladoIvankovic/codeep-action@v1
        with:
          fail-on: none   # informational rollout: posts comment + annotations, never blocks. Tighten to error|warning once trusted.
